name: Workshop checks

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

jobs:
  check:
    name: check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # Pinned release archives from github.com, not apt: a package-archive
      # outage must not take the required checks down with it. The script's
      # header has the incident and the pins.
      - name: Install check dependencies
        run: |
          sudo bash Tools/ci/install-check-tools.sh /usr/local
          echo "shellcheck: $(command -v shellcheck)"
          echo "zsh: $(command -v zsh)"
      - name: Run Workshop checks
        run: make check
